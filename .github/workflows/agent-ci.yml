name: Kiosk Agent CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'android/platform/ui/web/agent/**'
      - 'android/platform/ui/build.gradle.kts'
      - '.github/workflows/agent-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'android/platform/ui/web/agent/**'
      - 'android/platform/ui/build.gradle.kts'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'android/platform/ui/web/agent/package-lock.json'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Run ESLint via Gradle
        run: |
          cd android
          ./gradlew :platform-ui:lintWebAgent --no-daemon
        continue-on-error: true

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'android/platform/ui/web/agent/package-lock.json'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Run tests via Gradle
        run: |
          cd android
          ./gradlew :platform-ui:testWebAgent --no-daemon
        env:
          NODE_ENV: test
          AGENT_ENV: DEV

  build:
    name: Build ${{ matrix.module }}
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      matrix:
        module:
          - platform-ui:web:agent
          - platform-ui:web:kiosk-agent
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'android/platform/ui/web/*/package-lock.json'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Determine module tasks
        id: module-tasks
        run: |
          # Convert matrix module to Gradle task format
          MODULE="${{ matrix.module }}"
          GRADLE_PATH=":${MODULE//:/:}"
          
          echo "gradle_path=$GRADLE_PATH" >> $GITHUB_OUTPUT
          
          # Determine specific tasks based on module
          if [[ "$MODULE" == *"agent"* ]]; then
            echo "lint_task=lintWebAgent" >> $GITHUB_OUTPUT
            echo "test_task=testWebAgent" >> $GITHUB_OUTPUT
            echo "build_task=buildWebAgent" >> $GITHUB_OUTPUT
          else
            echo "lint_task=lintWeb" >> $GITHUB_OUTPUT
            echo "test_task=testWeb" >> $GITHUB_OUTPUT
            echo "build_task=buildWeb" >> $GITHUB_OUTPUT
          fi

      - name: Run Lint for ${{ matrix.module }}
        run: |
          cd android
          ./gradlew :platform-ui:${{ steps.module-tasks.outputs.lint_task }} --no-daemon || true
        continue-on-error: true

      - name: Run Tests for ${{ matrix.module }}
        run: |
          cd android
          ./gradlew :platform-ui:${{ steps.module-tasks.outputs.test_task }} --no-daemon || true
        continue-on-error: true
        env:
          NODE_ENV: test
          AGENT_ENV: DEV

      - name: Build ${{ matrix.module }}
        run: |
          cd android
          ./gradlew :platform-ui:${{ steps.module-tasks.outputs.build_task }} --no-daemon

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.module }}-${{ github.run_number }}
          path: |
            android/platform/ui/web/*/dist
            android/platform/ui/web/*/package.json
            android/platform/ui/web/*/package-lock.json
          retention-days: 7
          if-no-files-found: warn

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/kiosk-agent
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Image digest
        run: echo ${{ steps.meta.outputs.tags }}
