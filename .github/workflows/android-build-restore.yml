name: Android Build (Restored)

on:
    workflow_dispatch:
        inputs:
            gradle_tasks:
                description: "Команды Gradle (по умолчанию clean lint detekt test assembleDebug)"
                required: false
                default: "clean lint detekt test assembleDebug"
    push:
        branches:
            - main
            - develop
            - "release/**"
        paths:
            - "android/**"
            - ".github/workflows/android-build-restore.yml"
    pull_request:
        branches:
            - main
            - develop
        paths:
            - "android/**"
            - ".github/workflows/android-build-restore.yml"

jobs:
    build:
        name: Android · GitHub hosted
        runs-on: ubuntu-latest
        timeout-minutes: 45

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Java 17
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "17"

            - name: Install Android SDK components
              uses: android-actions/setup-android@v2
              with:
                  api-level: 35
                  build-tools: 35.0.0

            - name: Prepare Gradle
              uses: gradle/actions/setup-gradle@v3
              with:
                  build-root-directory: android

            - name: Ensure gradlew is executable
              run: chmod +x gradlew
              working-directory: android

            - name: Run Gradle tasks
              run: ./gradlew ${{ inputs.gradle_tasks || 'clean lint detekt test assembleDebug' }} --build-cache --stacktrace
              working-directory: android

            - name: Upload app-debug APK
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: app-debug-apk-restored
                  path: android/app/build/outputs/apk/debug/app-debug.apk
                  if-no-files-found: warn

            - name: Upload Gradle caches
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: gradle-caches-restored
                  path: |
                      ~/.gradle/caches
                      ~/.gradle/wrapper
                  retention-days: 7
                  if-no-files-found: warn
