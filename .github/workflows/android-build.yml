name: Android Build (AGP Unblock)

on:
    workflow_dispatch:
    push:
        branches:
            - main
            - develop
            - "release/**"
        paths:
            - "android/**"
            - ".github/workflows/android-build.yml"
    pull_request:
        branches:
            - main
            - develop
        paths:
            - "android/**"
            - ".github/workflows/android-build.yml"

jobs:
    assemble-debug:
        name: Gradle · assembleDebug
        runs-on: ubuntu-latest
        timeout-minutes: 45

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Java 17
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "17"

            - name: Install Android SDK components
              uses: android-actions/setup-android@v2
              with:
                  api-level: 35
                  build-tools: 35.0.0

            - name: Prepare Gradle configuration cache
              uses: gradle/actions/setup-gradle@v3
              with:
                  build-root-directory: android

            - name: Ensure gradlew is executable
              run: chmod +x gradlew
              working-directory: android

            - name: Gradle lint · test · assembleDebug
              run: ./gradlew lint test assembleDebug --build-cache --stacktrace
              working-directory: android

            - name: Upload APK artifact
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: app-debug-apk
                  path: android/app/build/outputs/apk/debug/app-debug.apk
                  if-no-files-found: warn

            - name: Upload Gradle dependency cache (optional)
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: gradle-caches
                  path: |
                      ~/.gradle/caches
                      ~/.gradle/wrapper
                  retention-days: 7
                  if-no-files-found: warn
