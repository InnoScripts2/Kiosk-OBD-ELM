name: Verify APK Manifest

on:
  push:
    paths:
      - "10-tools/04-infrastructure/artifacts/third-party/**"
      - "06-infra/04-infrastructure/infra-root/scripts/apk-manifest.ps1"
      - ".github/workflows/apk-manifest-verify.yml"
  pull_request:
    paths:
      - "10-tools/04-infrastructure/artifacts/third-party/**"
      - "06-infra/04-infrastructure/infra-root/scripts/apk-manifest.ps1"

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show runner environment and list script directory
        shell: pwsh
        run: |
          Write-Host "=== pwsh version ==="
          pwsh -v
          Write-Host "=== Current location ==="
          Get-Location | Write-Host
          Write-Host "=== List top-level files/dirs (showing .github and infra) ==="
          Get-ChildItem -Force -Depth 2 | Where-Object { $_.FullName -like "*06-infra*" -or $_.FullName -like "*\.github*" } | Format-Table -AutoSize

      - name: Verify script exists and show header
        shell: pwsh
        run: |
          $scriptPath = ".\06-infra\04-infrastructure\infra-root\scripts\apk-manifest.ps1"
          Write-Host "Looking for: $scriptPath"
          if (-not (Test-Path $scriptPath)) {
            Write-Error "Script not found at $scriptPath"
            if (Test-Path ".\06-infra\04-infrastructure\infra-root\scripts") {
              Write-Host "Files under scripts folder:"
              Get-ChildItem -Path ".\06-infra\04-infrastructure\infra-root\scripts" -Recurse | Select-Object FullName,Length | Format-Table -AutoSize
            } else {
              Write-Host "Folder '.\06-infra/04-infrastructure/infra-root/scripts' does not exist in checkout."
            }
            exit 1
          } else {
            Write-Host "Script found. Showing first 120 lines:"
            Get-Content $scriptPath -TotalCount 120 | ForEach-Object { Write-Host $_ }
          }

      - name: Execute apk-manifest with full trace
        id: apk-manifest
        shell: pwsh
        run: |
          $scriptPath = ".\06-infra\04-infrastructure\infra-root\scripts\apk-manifest.ps1"
          Write-Host "Executing: & $scriptPath -Verify -Deterministic"
          # Включаем подробную трассировку и обработку ошибок
          $ErrorActionPreference = "Stop"
          try {
            & $scriptPath -Verify -Deterministic
            Write-Host "Script completed successfully."
          } catch {
            Write-Error "Script threw an exception: $($_.Exception.Message)"
            Write-Error $_.Exception.StackTrace
            Exit 1
          }
      
      - name: Upload APK Manifest Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-manifest-reports-${{ github.run_number }}
          path: |
            10-tools/04-infrastructure/artifacts/third-party/**/*.json
            10-tools/04-infrastructure/artifacts/third-party/**/*.md
            06-infra/04-infrastructure/infra-root/scripts/logs/*.log
          retention-days: 30
          if-no-files-found: warn
      
      - name: Generate Summary
        if: always()
        shell: pwsh
        run: |
          $summary = "## 📦 APK Manifest Verification`n`n"
          $summary += "**Date**: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')`n"
          $summary += "**Status**: ${{ steps.apk-manifest.outcome }}`n`n"
          
          if ("${{ steps.apk-manifest.outcome }}" -eq "success") {
            $summary += "✅ All APK manifests verified successfully`n"
          } else {
            $summary += "❌ APK manifest verification failed`n"
            $summary += "`n**Action Required**: Check uploaded reports for details`n"
          }
          
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8