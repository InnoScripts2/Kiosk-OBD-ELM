name: OBD Database & Frontend CI/CD

on:
  push:
    branches: [ main, develop, copilot/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  python-tests:
    name: Python Tests (DTC Catalog Builder)
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          cd android/tools/dtc
          pip install -r requirements.txt
          
      - name: Run pytest
        run: |
          cd android/tools/dtc
          pytest test_build_catalog.py -v --tb=short
          
      - name: Test catalog generation
        run: |
          cd android
          python3 tools/dtc/build_catalog.py --version ci-test
          
      - name: Verify generated files
        run: |
          test -f android/feature-obd-core/src/main/resources/com/selfservice/obd/core/dtc/dtc.json
          test -f android/platform/data/src/main/assets/dtc_database.json
          test -f android/platform/data/src/main/assets/catalog_version.json
          echo "All catalog files generated successfully"

  android-tests:
    name: Android Tests (Platform Data)
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        
      - name: Run platform-data tests
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :platform-data:test --no-daemon
          
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: android/platform/data/build/reports/tests/

  frontend-ci:
    name: Frontend CI (Lint, Test, Build)
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
          cache-dependency-path: apps/kiosk-frontend/pnpm-lock.yaml
          
      - name: Install dependencies
        run: |
          cd apps/kiosk-frontend
          pnpm install --frozen-lockfile || pnpm install
          
      - name: Run ESLint
        run: |
          cd apps/kiosk-frontend
          pnpm lint
          
      - name: Type check
        run: |
          cd apps/kiosk-frontend
          pnpm type-check
          
      - name: Build
        run: |
          cd apps/kiosk-frontend
          pnpm build
          
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/kiosk-frontend/dist/
