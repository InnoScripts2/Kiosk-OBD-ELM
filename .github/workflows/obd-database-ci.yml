name: OBD Database CI/CD

on:
  push:
    branches: [ main, develop, copilot/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  python-tests:
    name: Python Tests (DTC Catalog Builder)
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          cd android/tools/dtc
          pip install -r requirements.txt
          
      - name: Run pytest
        run: |
          cd android/tools/dtc
          pytest test_build_catalog.py -v --tb=short
          
      - name: Test catalog generation
        run: |
          cd android
          python3 tools/dtc/build_catalog.py --version ci-test
          
      - name: Verify generated files
        run: |
          test -f android/feature-obd-core/src/main/resources/com/selfservice/obd/core/dtc/dtc.json
          test -f android/platform/data/src/main/assets/dtc_database.json
          test -f android/platform/data/src/main/assets/catalog_version.json
          echo "✅ All catalog files generated successfully"

  android-tests:
    name: Android Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        
      - name: Run platform-data tests
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :platform-data:test --no-daemon
          
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: android/platform/data/build/reports/tests/

  android-lint:
    name: Android Lint & Detekt
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        
      - name: Run lint
        run: |
          cd android
          chmod +x gradlew
          ./gradlew lint --no-daemon
        continue-on-error: true
          
      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-results
          path: android/**/build/reports/lint-results*.html
